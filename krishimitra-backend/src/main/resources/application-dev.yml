# Development profile overrides
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/krishimitra
    username: krishimitra
    password: krishimitra_secret

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

krishimitra:
  ai-sidecar:
    base-url: http://localhost:8000
  cors:
    allowed-origins: "*"

logging:
  level:
    com.krishimitra: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
