server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: krishimitra-backend

  # ==================== Database ====================
  datasource:
    url: jdbc:postgresql://${KRISHIMITRA_DB_HOST:localhost}:${KRISHIMITRA_DB_PORT:5432}/${KRISHIMITRA_DB_NAME:krishimitra}
    username: ${KRISHIMITRA_DB_USERNAME:krishimitra}
    password: ${KRISHIMITRA_DB_PASSWORD:krishimitra_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  # ==================== Flyway ====================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ==================== File Upload ====================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  # ==================== Cache ====================
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m

  # ==================== Jackson ====================
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata

# ==================== KrishiMitra Custom Config ====================
krishimitra:
  jwt:
    secret: ${KRISHIMITRA_JWT_SECRET:dGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9yS3Jpc2hpTWl0cmFBSVBsYXRmb3JtMjAyNg==}
    access-token-expiration-ms: 86400000   # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days

  ai-sidecar:
    base-url: ${AI_SIDECAR_URL:http://localhost:8000}
    connect-timeout-ms: 10000
    read-timeout-ms: 120000

  weather:
    base-url: https://api.open-meteo.com/v1
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    disease-images-dir: ${UPLOAD_DIR:./uploads}/disease-images

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"

# ==================== ML Model Paths ====================
  ml:
    crop-model-path: classpath:models/crop_recommendation.onnx
    crop-labels-path: classpath:models/crop_labels.json
    disease-model-path: classpath:models/plant_disease.onnx
    disease-labels-path: classpath:models/disease_labels.json

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ==================== Logging ====================
logging:
  level:
    root: INFO
    com.krishimitra: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
